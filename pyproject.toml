[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-free-return"
version = "0.1.0"
description = "Earth-Moon lunar free-return trajectory simulator."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Lotfi Ben Taleb" }]
keywords = ["orbital-mechanics", "apollo-13", "free-return", "earth-moon", "rk4"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lunar-free-return = "lunar_free_return.cli:main"

[project.urls]
Homepage = "https://github.com/Tunisino7/lunar-free-return"
Repository = "https://github.com/Tunisino7/lunar-free-return"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
